<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Exchange — Minecraft Club of America</title>
  <meta name="description" content="Discover MCA companies, review their business, invest in offerings, and trade shares for Marks.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="images/icon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#18489e">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MCA">
  <style>
    /* Offset for the fixed 58px nav bar */
    body { padding-top: 58px; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--mid); margin-bottom: 5px; }
    .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 4px; font-family: 'Open Sans', sans-serif; font-size: 14px; background: var(--white); color: var(--black); box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--blue); }
    .form-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .form-error { font-size: 12px; color: #c0392b; margin-top: 6px; display: none; }
    .form-success { font-size: 12px; color: #2d7d2f; margin-top: 6px; display: none; }
    .btn { font-size: 12px; font-weight: 600; letter-spacing: .5px; padding: 9px 18px; border-radius: 4px; cursor: pointer; border: none; font-family: inherit; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--blue); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-danger { background: transparent; color: #c0392b; border: 1px solid var(--border); }
    .btn-danger:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
    .econ-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 768px) { .econ-two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<script type="module" src="nav.js"></script>
<div id="nav-root"></div>

<div class="econ-wrap">
  <div class="econ-hero">
    <div class="econ-hero-eyebrow">Stock Exchange</div>
    <h1 id="page-title">MCA Companies</h1>
    <div class="econ-hero-sub" id="page-sub">Businesses built by club members, funded in Marks.</div>
  </div>

  <div id="exchange-status"></div>

  <div class="econ-tabs" id="tabs">
    <button class="econ-tab" data-route="#/">Companies</button>
    <button class="econ-tab" data-route="#/offerings">Offerings</button>
    <button class="econ-tab" data-route="#/portfolio">My Portfolio</button>
    <button class="econ-tab" data-route="#/manage" id="tab-manage" style="display:none;">Company Tools</button>
    <button class="econ-tab" data-route="#/admin" id="tab-admin" style="display:none;">Admin</button>
  </div>

  <div id="view"><div class="econ-muted">Loading…</div></div>
</div>

<script type="module" src="stocks.page.js"></script>
</body>
</html>
