name: MCAVerify
version: '1.0.0'
main: com.mca.verify.MCAVerifyPlugin
api-version: '1.20'
author: MCA
description: Links Minecraft accounts to MCA website accounts via /mcaverify codes, and gates server join to active $12/year members. Replaces the old verify-only plugin — linking and membership gating are now one plugin.

commands:
  mcaverify:
    description: Verify your Minecraft account with the MCA website
    usage: /<command> <code>
  mcaunverify:
    description: (Admin) Force-unverify a player's linked account
    usage: /<command> <player>
    permission: mcaverify.admin
  mcalookup:
    description: (Admin) Look up a player's linked website account
    usage: /<command> <player>
    permission: mcaverify.admin

permissions:
  mcaverify.use:
    description: Allows use of /mcaverify
    default: true
  mcaverify.admin:
    description: Allows use of /mcaunverify and /mcalookup
    default: op
