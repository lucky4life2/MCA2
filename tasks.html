<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — Minecraft Club of America</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="images/icon.ico">
<style>
  .btn { font-size: 11px; font-weight: 600; letter-spacing: .5px; padding: 6px 14px; border-radius: 3px; cursor: pointer; transition: background .15s, color .15s, border-color .15s; border: none; white-space: nowrap; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-danger { background: transparent; color: #c0392b; border: 1px solid var(--border); }
  .btn-danger:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
  .btn-outline { background: transparent; color: var(--blue); border: 1px solid var(--border); }
  .btn-outline:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-outline.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .form-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-family: 'Open Sans', sans-serif; font-size: 13px; background: var(--white); color: var(--black); box-sizing: border-box; }
  .form-input:focus { outline: none; border-color: var(--blue); }
  .form-group { margin-bottom: 1rem; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
  .col2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .col2-grid { grid-template-columns: 1fr; } }

  .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 4rem 2.5rem 6rem; }
  .admin-hero { border-bottom: 1px solid var(--border); padding-bottom: 2.5rem; margin-bottom: 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .admin-hero-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--green); margin-bottom: 1rem; }
  .admin-hero h1 { font-family: 'Times New Roman', serif; font-size: clamp(28px, 4vw, 42px); font-weight: 700; color: var(--blue); line-height: 1.15; }
  .admin-loading { display: flex; align-items: center; justify-content: center; min-height: 60vh; flex-direction: column; gap: 12px; color: var(--muted); font-size: 14px; }
  .admin-loading-spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .admin-denied { text-align: center; padding: 6rem 2rem; }
  .admin-denied h2 { font-family: 'Times New Roman', serif; font-size: 1.6rem; color: var(--blue); font-weight: normal; margin-bottom: .75rem; }
  .admin-denied p { font-size: 14px; color: var(--muted); }

  /* Toolbar */
  .tk-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .tk-view-toggle { display: flex; gap: 6px; }
  .tk-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.75rem; }
  .tk-legend-chip { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 5px 10px 5px 8px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; background: var(--white); transition: border-color .15s, color .15s; }
  .tk-legend-chip:hover { color: var(--black); }
  .tk-legend-chip.active { border-color: var(--blue); color: var(--blue); }
  .tk-swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); flex-shrink: 0; }
  .tk-project-select { min-width: 180px; }

  /* List view */
  .tp-group { margin-bottom: 2rem; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tp-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg); gap: 10px; flex-wrap: wrap; }
  .tp-head-name { font-weight: 700; color: var(--blue); font-size: 14px; }
  .tp-head-actions { display: flex; gap: 6px; align-items: center; }
  .tp-head-actions button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 12px; }
  .tp-head-actions button:hover { color: var(--blue); }
  .tp-sort { font-size: 11px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--white); color: var(--black); }

  .t-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border); cursor: pointer; position: relative; }
  .t-row:hover { background: var(--bg); }
  .t-color-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.15); }
  .t-title { flex: 1; font-size: 13px; font-weight: 600; color: var(--black); }
  .t-title.done { text-decoration: line-through; color: var(--muted); }
  .t-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .t-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .t-badge.low { background: #e8f4ea; color: #2d7d2f; }
  .t-badge.medium { background: #eef1f8; color: var(--blue); }
  .t-badge.high { background: #fdf0e2; color: #b5691c; }
  .t-badge.urgent { background: #fbe6e6; color: #c0392b; }
  .t-status { font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
  .t-empty { padding: 16px; font-size: 12px; color: var(--muted); }

  /* Grid view */
  .tk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .tk-card { border-radius: 8px; padding: 12px 14px; cursor: pointer; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 1px 3px rgba(10,15,30,.08); transition: transform .12s, box-shadow .12s; display: flex; flex-direction: column; gap: 8px; min-height: 108px; }
  .tk-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(10,15,30,.16); }
  .tk-card-title { font-size: 13px; font-weight: 700; line-height: 1.35; }
  .tk-card-title.done { text-decoration: line-through; opacity: .7; }
  .tk-card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .tk-card-status { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; padding: 2px 7px; border-radius: 8px; background: rgba(255,255,255,.55); }
  .tk-card-meta { font-size: 10px; opacity: .85; white-space: nowrap; }
  .tk-card-project { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; opacity: .75; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,15,30,.5); z-index: 400; align-items: center; justify-content: center; padding: 1rem; }
  .modal-box { background: var(--white); border-radius: 8px; border: 1px solid var(--border); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(10,15,30,.2); }
  .modal-head { padding: 1.5rem 1.5rem 0; display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-family: 'Times New Roman', serif; font-size: 1.3rem; color: var(--blue); font-weight: normal; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px; }
  .modal-body { padding: 1.5rem; }
  .modal-foot { padding: 0 1.5rem 1.5rem; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  .comment { padding: 8px 0; border-top: 1px solid var(--border); font-size: 12px; }
  .comment-meta { color: var(--muted); font-size: 11px; margin-bottom: 2px; }

  /* Status swatch picker inside task modal */
  .status-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .status-pick { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 20px; border: 2px solid transparent; background: var(--bg); cursor: pointer; color: var(--black); }
  .status-pick .tk-swatch { width: 13px; height: 13px; }
  .status-pick.selected { border-color: var(--blue); }

  .custom-color-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .custom-color-row input[type=color] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: none; }
  .custom-color-note { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<div class="page-wrap">
  <div id="loading" class="admin-loading"><div class="admin-loading-spinner"></div><span>Loading...</span></div>

  <div id="denied" class="admin-wrap admin-denied" style="display:none;">
    <h2>Access Denied</h2>
    <p>You don't have permission to view this page.</p>
  </div>

  <div id="main" class="admin-wrap" style="display:none;">
    <div class="admin-hero">
      <div>
        <div class="admin-hero-eyebrow">Staff Only</div>
        <h1>Task Board</h1>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" id="btn-new-project" style="font-size:12px;padding:7px 16px;">+ Project</button>
        <button class="btn btn-primary" id="btn-new-task" style="font-size:12px;padding:7px 16px;">+ Task</button>
      </div>
    </div>

    <div class="tk-toolbar">
      <div class="tk-view-toggle">
        <button class="btn btn-outline active" id="btn-view-list">☰ List</button>
        <button class="btn btn-outline" id="btn-view-grid">▦ Grid</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="tk-project-filter" class="form-input tk-project-select"><option value="">All Projects</option></select>
      </div>
    </div>

    <div id="tk-legend" class="tk-legend"></div>

    <div id="board"></div>
  </div>
</div>

<!-- Project modal -->
<div class="modal-overlay" id="pj-modal">
  <div class="modal-box" style="max-width:400px;">
    <div class="modal-head"><div class="modal-title" id="pj-title">New Project</div><button class="modal-close" id="pj-close">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="pj-id">
      <div class="form-group"><label class="form-label">Project Name</label><input type="text" id="pj-name" class="form-input"></div>
    </div>
    <div id="pj-error" style="font-size:13px;color:#c0392b;padding:0 1.5rem .5rem;display:none;"></div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="pj-delete" style="display:none;font-size:13px;">Delete</button>
      <button class="btn btn-outline" id="pj-cancel" style="font-size:13px;">Cancel</button>
      <button class="btn btn-primary" id="pj-save" style="font-size:13px;">Save</button>
    </div>
  </div>
</div>

<!-- Task modal -->
<div class="modal-overlay" id="tk-modal">
  <div class="modal-box">
    <div class="modal-head"><div class="modal-title" id="tk-title">New Task</div><button class="modal-close" id="tk-close">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="tk-id">
      <div class="form-group"><label class="form-label">Title</label><input type="text" id="tk-name" class="form-input"></div>
      <div class="form-group"><label class="form-label">Description</label><textarea id="tk-desc" class="form-input" rows="2" style="resize:vertical;"></textarea></div>
      <div class="col2-grid">
        <div class="form-group"><label class="form-label">Project</label><select id="tk-project" class="form-input"></select></div>
        <div class="form-group"><label class="form-label">Assignee</label><select id="tk-assignee" class="form-input"><option value="">Unassigned</option></select></div>
      </div>
      <div class="col2-grid">
        <div class="form-group"><label class="form-label">Due Date</label><input type="date" id="tk-due" class="form-input"></div>
        <div class="form-group"><label class="form-label">Priority</label>
          <select id="tk-priority" class="form-input">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Status &amp; Color</label>
        <div class="status-picker" id="tk-status-picker"></div>
        <div class="custom-color-row">
          <input type="color" id="tk-custom-color" value="#ffffff">
          <button class="btn btn-outline" id="tk-custom-color-apply" style="font-size:11px;">Use custom color</button>
          <button class="btn btn-outline" id="tk-custom-color-clear" style="font-size:11px;">Clear custom color</button>
        </div>
        <div class="custom-color-note" id="tk-color-note">Color follows the status above.</div>
      </div>

      <div id="tk-comments-wrap" style="display:none;margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem;">
        <label class="form-label">Comments</label>
        <div id="tk-comments"></div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <input type="text" id="tk-comment-input" class="form-input" placeholder="Add a comment...">
          <button class="btn btn-outline" id="tk-comment-add" style="font-size:12px;white-space:nowrap;">Post</button>
        </div>
      </div>
    </div>
    <div id="tk-error" style="font-size:13px;color:#c0392b;padding:0 1.5rem .5rem;display:none;"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="tk-mark-done" style="font-size:13px;">✓ Mark as Done</button>
      <button class="btn btn-danger" id="tk-delete" style="display:none;font-size:13px;">Delete</button>
      <button class="btn btn-outline" id="tk-cancel" style="font-size:13px;">Cancel</button>
      <button class="btn btn-primary" id="tk-save" style="font-size:13px;">Save</button>
    </div>
  </div>
</div>

<script type="module" src="nav.js"></script>
<script type="module">
import { supabase } from './supabase.js';

// ── Status / color system ──────────────────────────────────────
// Order doubles as sort order for the grid view.
const STATUSES = [
  { key: 'does_it_work',         label: 'Does It Work?',          color: '#A02B93' },
  { key: 'in_progress',          label: 'In Progress',            color: '#FFD400' },
  { key: 'required_for_release', label: 'Required for Release',   color: '#FF0000' },
  { key: 'saved_for_later',      label: 'Saved for Later Testing',color: '#E97132' },
  { key: 'undecided',            label: 'Undecided',              color: '#A5A5A5' },
  { key: 'no_color',             label: 'No Color',               color: '#D9D9D9' },
];
// Kept for reference/lookup even though hidden from the board (existing tasks in these
// statuses stay in the database, they're just not shown here).
const HIDDEN_STATUSES = {
  finished_fixed: { key: 'finished_fixed', label: 'Finished / Fixed', color: '#92D050' },
  not_possible:   { key: 'not_possible',   label: 'Not Possible',     color: '#0F9ED5' },
};
const STATUS_MAP = Object.fromEntries([...STATUSES, ...Object.values(HIDDEN_STATUSES)].map(s => [s.key, s]));
const STATUS_ORDER = Object.fromEntries(STATUSES.map((s, i) => [s.key, i]));

function statusColor(key) { return (STATUS_MAP[key] || STATUS_MAP.no_color).color; }
function taskColor(t) { return t.custom_color || statusColor(t.status); }
function contrastText(hex) {
  if (!hex) return '#111';
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const yiq = (r*299 + g*587 + b*114) / 1000;
  return yiq >= 150 ? '#111111' : '#ffffff';
}

let _projects = [], _tasks = [], _members = [], _me = null;
let _view = 'list';
let _projectFilter = '';
let _statusFilter = null; // null = all, or a status key
const PRIORITY_ORDER = { urgent: 0, high: 1, medium: 2, low: 3 };

let _projectSort = {}; // { [projectId]: 'color' | 'name' | 'due' | 'priority' }
function sortKeyFor(projectId) { return _projectSort[projectId] || 'color'; }

function sortSelectHtml(projectId) {
  const current = sortKeyFor(projectId);
  const opts = [['color','Color'],['name','Name'],['due','Due Date'],['priority','Priority']];
  return `<select class="tp-sort" data-project="${projectId}">
    ${opts.map(([v,l]) => `<option value="${v}"${v===current?' selected':''}>Sort: ${l}</option>`).join('')}
  </select>`;
}

function attachProjectSortListeners() {
  document.querySelectorAll('.tp-sort').forEach(sel => {
    sel.onchange = (e) => {
      _projectSort[sel.dataset.project] = e.target.value;
      render();
    };
  });
}

function sortTasks(list, sortBy) {
  const arr = list.slice();
  if (sortBy === 'name') {
    arr.sort((a, b) => a.title.localeCompare(b.title));
  } else if (sortBy === 'due') {
    arr.sort((a, b) => {
      if (!a.due_date && !b.due_date) return 0;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return a.due_date.localeCompare(b.due_date);
    });
  } else if (sortBy === 'priority') {
    arr.sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9));
  } else { // color
    arr.sort((a, b) => {
      const so = (STATUS_ORDER[a.status] ?? 99) - (STATUS_ORDER[b.status] ?? 99);
      if (so !== 0) return so;
      return a.title.localeCompare(b.title);
    });
  }
  return arr;
}

async function canManageTasks(userId) {
  try {
    const { data } = await supabase.rpc('user_has_permission', { perm: 'can_manage_tasks' });
    if (data === true) return true;
  } catch {}
  const { data: profile } = await supabase.from('profiles').select('role').eq('id', userId).single();
  return profile?.role === 'admin' || profile?.role === 'owner';
}

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.user) return show('denied');
  _me = session.user;
  if (!(await canManageTasks(_me.id))) return show('denied');
  show('main');
  buildLegend();
  await loadAll();
}

function show(which) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('denied').style.display = which === 'denied' ? 'block' : 'none';
  document.getElementById('main').style.display = which === 'main' ? 'block' : 'none';
}

async function loadAll() {
  const [{ data: projects }, { data: tasks }, { data: members }, { data: userRoles }] = await Promise.all([
    supabase.from('task_projects').select('*').order('sort_order').order('created_at'),
    supabase.from('tasks').select('*').order('due_date', { nullsFirst: false }),
    supabase.from('profiles').select('id, display_name, username, role'),
    supabase.from('user_roles').select('user_id, roles(level)'),
  ]);
  _projects = projects || []; _tasks = tasks || [];

  const levelByUser = {};
  (userRoles || []).forEach(ur => {
    const lvl = ur.roles?.level || 0;
    if (lvl > (levelByUser[ur.user_id] || 0)) levelByUser[ur.user_id] = lvl;
  });
  const legacyLevel = { owner: 100, admin: 80 };
  _members = (members || []).filter(m => {
    const lvl = Math.max(levelByUser[m.id] || 0, legacyLevel[m.role] || 0);
    return lvl >= 50;
  });

  fillSelects(); render();
}

function fillSelects() {
  const pjSel = document.getElementById('tk-project');
  pjSel.innerHTML = _projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  const asSel = document.getElementById('tk-assignee');
  asSel.innerHTML = '<option value="">Unassigned</option>' + _members.map(m => `<option value="${m.id}">${m.display_name || m.username}</option>`).join('');
  const filterSel = document.getElementById('tk-project-filter');
  const prevVal = filterSel.value;
  filterSel.innerHTML = '<option value="">All Projects</option>' + _projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  filterSel.value = prevVal;
}

function memberName(id) {
  const m = _members.find(m => m.id === id);
  return m ? (m.display_name || m.username) : '';
}

function visibleTasks() {
  let list = _tasks.filter(t => !HIDDEN_STATUSES[t.status]);
  if (_projectFilter) list = list.filter(t => t.project_id === _projectFilter);
  if (_statusFilter) list = list.filter(t => t.status === _statusFilter);
  return list;
}

// ── Legend (also acts as color filter) ──
function buildLegend() {
  const el = document.getElementById('tk-legend');
  el.innerHTML = STATUSES.map(s => `
    <div class="tk-legend-chip" data-status="${s.key}">
      <span class="tk-swatch" style="background:${s.color};"></span>${s.label}
    </div>`).join('');
  el.querySelectorAll('.tk-legend-chip').forEach(chip => {
    chip.onclick = () => {
      const key = chip.dataset.status;
      _statusFilter = (_statusFilter === key) ? null : key;
      el.querySelectorAll('.tk-legend-chip').forEach(c => c.classList.toggle('active', c.dataset.status === _statusFilter));
      render();
    };
  });
}

document.getElementById('tk-project-filter').onchange = (e) => { _projectFilter = e.target.value; render(); };
document.getElementById('btn-view-list').onclick = () => setView('list');
document.getElementById('btn-view-grid').onclick = () => setView('grid');
function setView(v) {
  _view = v;
  document.getElementById('btn-view-list').classList.toggle('active', v === 'list');
  document.getElementById('btn-view-grid').classList.toggle('active', v === 'grid');
  render();
}

function render() {
  if (_view === 'grid') renderGrid(); else renderList();
}

function orderedProjects() {
  return _projectFilter ? _projects.filter(p => p.id === _projectFilter) : _projects.slice();
}

function renderList() {
  const board = document.getElementById('board');
  if (!_projects.length) { board.innerHTML = '<div class="t-empty">No projects yet — create one to start adding tasks.</div>'; return; }
  const projectsToShow = orderedProjects();
  board.innerHTML = projectsToShow.map(p => {
    const rows = sortTasks(visibleTasks().filter(t => t.project_id === p.id), sortKeyFor(p.id));
    return `
    <div class="tp-group">
      <div class="tp-head">
        <div class="tp-head-name">${p.name}</div>
        <div class="tp-head-actions">
          ${sortSelectHtml(p.id)}
          <button onclick="editProject('${p.id}')">Edit</button>
        </div>
      </div>
      ${rows.length ? rows.map(t => {
        const color = taskColor(t);
        const txt = contrastText(color);
        const st = STATUS_MAP[t.status] || STATUS_MAP.no_color;
        return `
        <div class="t-row" onclick="editTask('${t.id}')">
          <span class="t-color-dot" style="background:${color};"></span>
          <div class="t-title${t.status === 'finished_fixed' ? ' done' : ''}">${t.title}</div>
          ${t.assignee_id ? `<div class="t-meta">${memberName(t.assignee_id)}</div>` : ''}
          ${t.due_date ? `<div class="t-meta">${t.due_date}</div>` : ''}
          <div class="t-badge ${t.priority}">${t.priority}</div>
          <div class="t-status" style="background:${color};color:${txt};">${st.label}</div>
        </div>`;
      }).join('') : '<div class="t-empty">No tasks in this project.</div>'}
    </div>`;
  }).join('');
  attachProjectSortListeners();
}

function renderGrid() {
  const board = document.getElementById('board');
  if (!_projects.length) { board.innerHTML = '<div class="t-empty">No projects yet — create one to start adding tasks.</div>'; return; }
  const projectsToShow = orderedProjects();
  board.innerHTML = projectsToShow.map(p => {
    const cards = sortTasks(visibleTasks().filter(t => t.project_id === p.id), sortKeyFor(p.id));
    return `
    <div class="tp-group">
      <div class="tp-head">
        <div class="tp-head-name">${p.name}</div>
        <div class="tp-head-actions">
          ${sortSelectHtml(p.id)}
          <button onclick="editProject('${p.id}')">Edit</button>
        </div>
      </div>
      <div style="padding:14px 16px;">
        ${cards.length ? `<div class="tk-grid">${cards.map(t => {
          const color = taskColor(t);
          const txt = contrastText(color);
          const st = STATUS_MAP[t.status] || STATUS_MAP.no_color;
          return `
          <div class="tk-card" style="background:${color};color:${txt};" onclick="editTask('${t.id}')">
            <div class="tk-card-title${t.status === 'finished_fixed' ? ' done' : ''}" style="color:${txt};">${t.title}</div>
            <div class="tk-card-foot">
              <span class="tk-card-status" style="color:${txt};">${st.label}</span>
              ${t.due_date ? `<span class="tk-card-meta" style="color:${txt};">${t.due_date}</span>` : ''}
            </div>
          </div>`;
        }).join('')}</div>` : '<div class="t-empty">No tasks in this project.</div>'}
      </div>
    </div>`;
  }).join('');
  attachProjectSortListeners();
}

// ── Project modal ──
function openProjectModal(p) {
  document.getElementById('pj-id').value = p?.id || '';
  document.getElementById('pj-name').value = p?.name || '';
  document.getElementById('pj-title').textContent = p ? 'Edit Project' : 'New Project';
  document.getElementById('pj-delete').style.display = p ? '' : 'none';
  document.getElementById('pj-error').style.display = 'none';
  document.getElementById('pj-modal').style.display = 'flex';
}
window.editProject = (id) => openProjectModal(_projects.find(p => p.id === id));
document.getElementById('btn-new-project').onclick = () => openProjectModal(null);
document.getElementById('pj-close').onclick = document.getElementById('pj-cancel').onclick = () => document.getElementById('pj-modal').style.display = 'none';
document.getElementById('pj-save').onclick = async () => {
  const id = document.getElementById('pj-id').value;
  const name = document.getElementById('pj-name').value.trim();
  const errEl = document.getElementById('pj-error');
  if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display = 'block'; return; }
  const { error } = id ? await supabase.from('task_projects').update({ name }).eq('id', id) : await supabase.from('task_projects').insert({ name });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  document.getElementById('pj-modal').style.display = 'none'; loadAll();
};
document.getElementById('pj-delete').onclick = async () => {
  const id = document.getElementById('pj-id').value;
  if (!confirm('Delete this project and all its tasks?')) return;
  await supabase.from('task_projects').delete().eq('id', id);
  document.getElementById('pj-modal').style.display = 'none'; loadAll();
};

// ── Task modal ──
let _editingCustomColor = null; // holds pending custom_color for the open task ('' = cleared, null = untouched, '#hex' = set)
let _editingStatus = null;

function buildStatusPicker(selectedStatus) {
  const el = document.getElementById('tk-status-picker');
  const allStatuses = [...STATUSES, ...Object.values(HIDDEN_STATUSES)];
  el.innerHTML = allStatuses.map(s => `
    <div class="status-pick${s.key === selectedStatus ? ' selected' : ''}" data-status="${s.key}">
      <span class="tk-swatch" style="background:${s.color};"></span>${s.label}
    </div>`).join('');
  el.querySelectorAll('.status-pick').forEach(pick => {
    pick.onclick = () => {
      _editingStatus = pick.dataset.status;
      el.querySelectorAll('.status-pick').forEach(p => p.classList.toggle('selected', p.dataset.status === _editingStatus));
      updateColorNote();
    };
  });
}

function updateColorNote() {
  const note = document.getElementById('tk-color-note');
  if (_editingCustomColor) {
    note.textContent = `Using custom color ${_editingCustomColor} instead of the status color.`;
  } else {
    note.textContent = 'Color follows the status selected above.';
  }
}

async function openTaskModal(t) {
  document.getElementById('tk-id').value = t?.id || '';
  document.getElementById('tk-name').value = t?.title || '';
  document.getElementById('tk-desc').value = t?.description || '';
  document.getElementById('tk-project').value = t?.project_id || _projects[0]?.id || '';
  document.getElementById('tk-assignee').value = t?.assignee_id || '';
  document.getElementById('tk-due').value = t?.due_date || '';
  document.getElementById('tk-priority').value = t?.priority || 'medium';
  document.getElementById('tk-title').textContent = t ? 'Edit Task' : 'New Task';
  document.getElementById('tk-delete').style.display = t ? '' : 'none';
  const doneBtn = document.getElementById('tk-mark-done');
  doneBtn.style.display = t ? '' : 'none';
  doneBtn.textContent = (t && t.status === 'finished_fixed') ? '↺ Mark as Not Done' : '✓ Mark as Done';
  document.getElementById('tk-error').style.display = 'none';
  document.getElementById('tk-comments-wrap').style.display = t ? '' : 'none';

  _editingStatus = t?.status || 'no_color';
  _editingCustomColor = t?.custom_color || null;
  buildStatusPicker(_editingStatus);
  document.getElementById('tk-custom-color').value = _editingCustomColor || statusColor(_editingStatus);
  updateColorNote();

  if (t) await loadComments(t.id);
  document.getElementById('tk-modal').style.display = 'flex';
}
window.editTask = (id) => openTaskModal(_tasks.find(t => t.id === id));
window.markDone = async (id) => {
  await supabase.from('tasks').update({ status: 'finished_fixed', updated_at: new Date().toISOString() }).eq('id', id);
  loadAll();
};
document.getElementById('btn-new-task').onclick = () => {
  if (!_projects.length) { alert('Create a project first.'); return; }
  openTaskModal(null);
};
document.getElementById('tk-close').onclick = document.getElementById('tk-cancel').onclick = () => document.getElementById('tk-modal').style.display = 'none';

document.getElementById('tk-custom-color-apply').onclick = () => {
  _editingCustomColor = document.getElementById('tk-custom-color').value;
  updateColorNote();
};
document.getElementById('tk-custom-color-clear').onclick = () => {
  _editingCustomColor = null;
  document.getElementById('tk-custom-color').value = statusColor(_editingStatus);
  updateColorNote();
};

document.getElementById('tk-mark-done').onclick = async () => {
  const id = document.getElementById('tk-id').value;
  const t = _tasks.find(x => x.id === id);
  const newStatus = t?.status === 'finished_fixed' ? 'no_color' : 'finished_fixed';
  await supabase.from('tasks').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
  document.getElementById('tk-modal').style.display = 'none'; loadAll();
};
document.getElementById('tk-save').onclick = async () => {
  const id = document.getElementById('tk-id').value;
  const title = document.getElementById('tk-name').value.trim();
  const errEl = document.getElementById('tk-error');
  if (!title) { errEl.textContent = 'Title is required.'; errEl.style.display = 'block'; return; }
  const payload = {
    title,
    description: document.getElementById('tk-desc').value.trim() || null,
    project_id: document.getElementById('tk-project').value,
    assignee_id: document.getElementById('tk-assignee').value || null,
    due_date: document.getElementById('tk-due').value || null,
    priority: document.getElementById('tk-priority').value,
    status: _editingStatus || 'no_color',
    custom_color: _editingCustomColor || null,
    updated_at: new Date().toISOString(),
  };
  let error;
  if (id) {
    ({ error } = await supabase.from('tasks').update(payload).eq('id', id));
  } else {
    payload.created_by = _me.id;
    ({ error } = await supabase.from('tasks').insert(payload));
  }
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  document.getElementById('tk-modal').style.display = 'none'; loadAll();
};
document.getElementById('tk-delete').onclick = async () => {
  const id = document.getElementById('tk-id').value;
  if (!confirm('Delete this task?')) return;
  await supabase.from('tasks').delete().eq('id', id);
  document.getElementById('tk-modal').style.display = 'none'; loadAll();
};

// ── Comments ──
async function loadComments(taskId) {
  const { data } = await supabase.from('task_comments').select('*').eq('task_id', taskId).order('created_at');
  document.getElementById('tk-comments').innerHTML = (data || []).map(c => `
    <div class="comment"><div class="comment-meta">${memberName(c.author_id) || 'Staff'} · ${new Date(c.created_at).toLocaleString()}</div>${c.body}</div>
  `).join('') || '<div class="t-empty">No comments yet.</div>';
}
document.getElementById('tk-comment-add').onclick = async () => {
  const taskId = document.getElementById('tk-id').value;
  const input = document.getElementById('tk-comment-input');
  const body = input.value.trim();
  if (!body || !taskId) return;
  await supabase.from('task_comments').insert({ task_id: taskId, author_id: _me.id, body });
  input.value = '';
  loadComments(taskId);
};

init();
</script>
</body>
</html>
