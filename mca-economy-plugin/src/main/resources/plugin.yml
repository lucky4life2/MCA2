name: MCAEconomy
version: '1.0.0'
main: com.mca.economy.MCAEconomyPlugin
api-version: '1.21'
depend: [Vault]
author: MCA
description: MCA's website-integrated economy — bank accounts, companies, and shares, backed by Supabase.

commands:
  bank:
    description: Manage your bank accounts.
    usage: /bank <balance|list|create|pay|invite|history>
  company:
    description: Manage and trade company shares.
    usage: /company <list|info|found|buy|sell|setprice>

permissions:
  mcaeconomy.use:
    description: Use /bank and /company for your own accounts.
    default: true
  mcaeconomy.admin:
    description: Bypass account ownership checks (mirrors can_manage_economy on the website).
    default: op
