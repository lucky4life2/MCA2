# MCA Economy — Supabase connection
#
# service-role-key BYPASSES row-level security. Treat it like a root
# database password: never commit it, never put it in a public repo,
# and only ever put it in this file on the server itself.
supabase:
  url: "https://hjaywokvgdzhvsoygctc.supabase.co"
  service-role-key: "PASTE_YOUR_SUPABASE_SERVICE_ROLE_KEY_HERE"

# How often (seconds) each online player's account list + balances are
# refreshed in the background so /bank balance and the Vault balance
# lookup can answer instantly instead of blocking on a network call.
cache-refresh-seconds: 30

# Currency display
currency:
  symbol: "$"
  name-singular: "Dollar"
  name-plural: "Dollars"
