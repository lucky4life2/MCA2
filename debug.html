<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Debug</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #f8f9fc; color: #111; }
    h2 { font-family: sans-serif; color: #18489e; }
    .box { background: #fff; border: 1px solid #dde3ee; border-radius: 6px; padding: 1.25rem; margin-bottom: 1rem; }
    .ok  { color: #2d7d2f; font-weight: bold; }
    .err { color: #c0392b; font-weight: bold; }
    .val { color: #555; }
    pre  { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
    button { font-family: sans-serif; background: #18489e; color: #fff; border: none;
             padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
<h2>🔍 Admin Access Debugger</h2>
<p style="font-family:sans-serif;font-size:14px;color:#555;">This page shows exactly what Supabase returns for your account. Share the results if you need help.</p>
<button onclick="runDiag()">Run Diagnostics</button>
<div id="out"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient(
  'https://hjaywokvgdzhvsoygctc.supabase.co',
  'sb_publishable_4lPs4a1t0cOdDRZ1VTpMpQ_fC2dHV_T'
);

function row(label, status, detail) {
  const icon = status === 'ok' ? '✅' : status === 'warn' ? '⚠️' : '❌';
  const cls  = status === 'ok' ? 'ok' : 'err';
  return `<div class="box">
    <span class="${cls}">${icon} ${label}</span>
    <pre class="val">${detail}</pre>
  </div>`;
}

window.runDiag = async function() {
  const out = document.getElementById('out');
  out.innerHTML = '<p style="font-family:sans-serif;font-size:13px;color:#888;">Running...</p>';
  let html = '';

  // 1. Session
  let userId = null;
  try {
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    if (!session) {
      html += row('Session', 'err', 'NOT LOGGED IN — you need to sign in first, then come back to this page.');
      out.innerHTML = html; return;
    }
    userId = session.user.id;
    html += row('Session', 'ok', `User ID: ${userId}\nEmail: ${session.user.email}`);
  } catch(e) {
    html += row('Session', 'err', e.message);
    out.innerHTML = html; return;
  }

  // 2. profiles.role
  try {
    const { data, error } = await sb.from('profiles').select('role, display_name').eq('id', userId).single();
    if (error) throw error;
    html += row('profiles.role (legacy)', 'ok', `role = "${data.role}"\ndisplay_name = "${data.display_name}"`);
  } catch(e) {
    html += row('profiles.role', 'err', `ERROR: ${e.message}\n(RLS may be blocking reads on profiles table)`);
  }

  // 3. roles table
  try {
    const { data, error } = await sb.from('roles').select('name, label, level');
    if (error) throw error;
    html += row('roles table', 'ok', data.length
      ? data.map(r => `${r.name} (level ${r.level})`).join('\n')
      : 'Table exists but is EMPTY — run migration.sql');
  } catch(e) {
    html += row('roles table', 'err', `ERROR: ${e.message}\nTable may not exist — run migration.sql`);
  }

  // 4. user_roles table
  try {
    const { data, error } = await sb.from('user_roles').select('role_id').eq('user_id', userId);
    if (error) throw error;
    html += row('user_roles (your rows)', data.length ? 'ok' : 'warn',
      data.length ? `Found ${data.length} role assignment(s) for your user` : 'NO ROLES ASSIGNED to your user_id in user_roles table');
  } catch(e) {
    html += row('user_roles table', 'err', `ERROR: ${e.message}`);
  }

  // 5. get_user_roles RPC
  try {
    const { data, error } = await sb.rpc('get_user_roles', { p_user_id: userId });
    if (error) throw error;
    html += row('get_user_roles RPC', 'ok', data.length
      ? JSON.stringify(data, null, 2)
      : 'RPC works but returned NO ROLES for your user');
  } catch(e) {
    html += row('get_user_roles RPC', 'err', `ERROR: ${e.message}`);
  }

  // 6. user_has_permission RPC
  try {
    const { data, error } = await sb.rpc('user_has_permission', { perm: 'can_view_admin' });
    if (error) throw error;
    html += row('user_has_permission(can_view_admin)', data ? 'ok' : 'err',
      data ? 'Returns TRUE ✓' : 'Returns FALSE — this is why admin is blocked');
  } catch(e) {
    html += row('user_has_permission RPC', 'err', `ERROR: ${e.message}`);
  }

  // 7. Summary
  html += `<div class="box" style="background:#e8eeff;">
    <strong style="font-family:sans-serif;">📋 Your User ID (needed for manual SQL fix):</strong>
    <pre style="user-select:all;cursor:text;">${userId}</pre>
    <p style="font-family:sans-serif;font-size:12px;color:#555;margin:8px 0 0;">
      If user_roles shows no assignments, run this in Supabase SQL Editor:<br><br>
      <code style="background:#fff;padding:4px 8px;border-radius:3px;font-size:12px;">
INSERT INTO user_roles (user_id, role_id)<br>
SELECT '${userId}', id FROM roles WHERE name = 'owner'<br>
ON CONFLICT DO NOTHING;
      </code>
    </p>
  </div>`;

  out.innerHTML = html;
};
</script>
</body>
</html>
